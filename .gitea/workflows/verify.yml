name: Verify dev

# Logic nằm ở repo dùng chung minhluc-info/ci; gate riêng ở .ci/verify.sh.
on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: verify-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: minhluc-info/ci/.gitea/workflows/verify.yml@main
    with:
      verify_script: .ci/verify.sh
      setup_go: "1.27.0"
