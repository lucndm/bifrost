name: Sync upstream-dev into dev

# Logic nằm ở repo dùng chung minhluc-info/ci. Chỉ push `dev`.
on:
  schedule:
    - cron: "0 20 * * *" # 03:00 Asia/Ho_Chi_Minh (UTC+7)
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    uses: minhluc-info/ci/.gitea/workflows/sync-upstream.yml@main
    with:
      upstream_branch: upstream-dev
      target_branch: dev
      gate_script: .ci/verify.sh
      setup_go: "1.27.0"
