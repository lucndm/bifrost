name: Docker Build (Fork)

# Builds the bifrost-http Docker image and pushes it to this fork's own
# GitHub Container Registry (ghcr.io/<owner>/<repo>). This is independent of
# the upstream release pipeline: no Docker Hub or upstream secrets involved.

on:
  push:
    branches: ["dev", "main"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@f931205d68723ad9589fd2a7e2ece238bf9de341 # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: step-security/docker-login-action@870af644803bf9f204aed474adbad2958fec048b # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image version and tags
        id: meta
        env:
          REGISTRY: ghcr.io
        run: |
          # transports/Dockerfile prefixes "v" itself (main.Version=v${VERSION})
          VERSION="${GITHUB_REF_NAME#v}"
          # ghcr.io requires lowercase image names
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          TAGS="${IMAGE}:${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            TAGS="${TAGS},${IMAGE}:${VERSION},latest"
          fi
          {
            echo "version=${VERSION}"
            echo "tags=${TAGS}"
          } >> "$GITHUB_OUTPUT"
          echo "Image tags: ${TAGS}"

      - name: Build and push image
        uses: step-security/docker-build-push-action@846549baaf047e867d038826129a64d81df0f704 # v7.1.0
        with:
          context: .
          # Workspace build: core + framework + transports from source, so the
          # image matches local framework code instead of released module versions.
          file: ./transports/Dockerfile.fork
          platforms: linux/amd64
          # Publish on branch/tag pushes; workflow_dispatch builds without pushing
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job summary
        run: |
          {
            echo "## Docker build"
            echo ""
            echo "- **Ref:** \`${GITHUB_REF_NAME}\`"
            echo "- **Pushed:** ${{ github.event_name == 'push' }}"
            echo ""
            echo "### Tags"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
